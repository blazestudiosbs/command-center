services:
  command-center:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: command-center
    network_mode: host
    env_file:
      - .env
    volumes:
      - /mnt/media:/host/mnt/media:ro
      - ./config:/app/config
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /etc/hostname:/host/etc/hostname:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - COMMAND_CENTER_NETWORK=192.168.50.0/24
      - COMMAND_CENTER_INTERFACE=enp3s0
    restart: unless-stopped
  command-center-ui:
    build:
      context: .
      dockerfile: frontend-react/Dockerfile
    container_name: command-center-ui
    network_mode: host
    restart: unless-stopped
  vera-discord:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: vera-discord
    command: ["python", "discord_worker.py"]
    network_mode: host
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4.1-mini}
      - VERA_DATABASE_PATH=/app/config/vera.db
      - VERA_DISCORD_GUILD_ID=1537268263782715392
      - VERA_DISCORD_CHANNEL_ID=1539806521280569424
      - VERA_DISCORD_TOKEN_FILE=/run/secrets/discord_bot_token
    volumes:
      - ./config:/app/config
      - ./secrets:/run/secrets:ro
    depends_on:
      - command-center
    restart: unless-stopped
  development-worker:
    build:
      context: .
      dockerfile: development-worker/Dockerfile
    container_name: development-worker
    working_dir: /workspace/command-center
    volumes:
      - /opt/command-center:/workspace/command-center
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config:/workspace/command-center/config
    restart: unless-stopped
